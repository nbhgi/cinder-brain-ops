services:
  - type: web
    name: cinder-brain-ops
    runtime: python
    region: oregon
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 -b 0.0.0.0:$PORT main:app
    sessionAffinity: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
